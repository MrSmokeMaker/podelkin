# Конфиг воркера (cloudflare/worker.js). Деплой — с машины с интернетом:
#   cd cloudflare && npx wrangler deploy
name = "craft-image-worker"
main = "worker.js"
compatibility_date = "2024-12-01"
account_id = "6a0502dbb518e85671b14a73e91dddf5"

# Биндинг Workers AI — даёт env.AI.run("@cf/black-forest-labs/flux-1-schnell", ...)
[ai]
binding = "AI"

