[build]
  command = "sh netlify-build.sh"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

[[redirects]]
  source = "/api/:splat"
  destination = "/:splat"
  status = 200

[[redirects]]
  source = "/sw.js"
  destination = "/sw.js"
  status = 200
  headers = { Cache-Control = "no-cache" }

[[redirects]]
  source = "/manifest.json"
  destination = "/manifest.json"
  status = 200

[[headers]]
  source = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  source = "/_next/static/:splat"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  source = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  source = "/api/health"
  [headers.values]
    Cache-Control = "no-cache"